<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chris Leonard Buenaluz</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#ffd6ec,#ffe6f7,#f3ccff);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Pages */
.page{
    display:none;
    text-align:center;
}

.active{
    display:block;
    animation:fade 0.6s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(15px);}
    to{opacity:1; transform:translateY(0);}
}

/* Card */
.card{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    width:330px;
}

/* Inputs */
input{
    width:100%;
    padding:12px;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ddd;
}

/* Buttons */
button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:#ff4da6;
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

/* Heart */
.heart{
    font-size:85px;
    cursor:pointer;
    animation:beat 1s infinite;
}

@keyframes beat{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

h2{
    color:#ff4da6;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
    <div class="card">
        <h2>Hello 💌</h2>
        <p>Enter your name first</p>
        <input type="text" id="nameInput" placeholder="Your name">
        <button onclick="nextPage()">Continue</button>
    </div>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
    <div class="card">
        <h2 id="greeting"></h2>
        <p>Click the heart</p>
        <div class="heart" onclick="showReadButton()">❤️</div>
        <div id="readSection" style="display:none;">
            <button onclick="openLetter()">Read Me</button>
        </div>
    </div>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
    <div class="card">
        <h2>For You 💖</h2>
        <p id="letter"></p>
    </div>
</div>

<script>
let name = "";

function nextPage(){
    name = document.getElementById("nameInput").value.trim();

    if(name === ""){
        alert("Please enter your name first!");
        return;
    }

    document.getElementById("greeting").innerText = "Hi " + name + " 💕";

    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
}

function showReadButton(){
    document.getElementById("readSection").style.display = "block";
}

function openLetter(){
    document.getElementById("page2").classList.remove("active");
    document.getElementById("page3").classList.add("active");

    document.getElementById("letter").innerHTML =
    "Hi " + name + ",<br><br>" +
    "I made this little website just for you because I wanted to say something special. " +
    "You’ve been on my mind for a long time, and I really enjoy talking to you and being around you. <br><br>" +
    "So today, I just want to ask you something simple but important... <br><br>" +
    "<b>Would you like to be with me?</b> 💕";
}
</script>

</body>
</html>
